<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настройка профиля - KaloriyaBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Настройка профиля</h1>
            <p>Заполни данные для расчёта нормы</p>
        </div>

        <form id="profile-form">
            <!-- Пол -->
            <div class="form-group">
                <label class="form-label">Пол</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" name="gender" id="gender-male" value="male" checked>
                        <label for="gender-male">👨 Мужской</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="gender" id="gender-female" value="female">
                        <label for="gender-female">👩 Женский</label>
                    </div>
                </div>
            </div>

            <!-- Возраст -->
            <div class="form-group">
                <label class="form-label" for="age">Возраст</label>
                <input type="number" class="form-input" id="age" name="age" placeholder="25" min="14" max="100" required>
            </div>

            <!-- Рост и Вес -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label class="form-label" for="height">Рост (см)</label>
                    <input type="number" class="form-input" id="height" name="height" placeholder="175" min="100" max="250" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="weight">Вес (кг)</label>
                    <input type="number" class="form-input" id="weight" name="weight" placeholder="70" min="30" max="300" step="0.1" required>
                </div>
            </div>

            <!-- Цель -->
            <div class="form-group">
                <label class="form-label">Цель</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" name="goal" id="goal-lose" value="lose">
                        <label for="goal-lose">🏃 Похудеть</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="goal" id="goal-maintain" value="maintain" checked>
                        <label for="goal-maintain">⚖️ Поддержать</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="goal" id="goal-gain" value="gain">
                        <label for="goal-gain">💪 Набрать</label>
                    </div>
                </div>
            </div>

            <!-- Целевой вес -->
            <div class="form-group" id="target-weight-group" style="display: none;">
                <label class="form-label" for="target_weight">Целевой вес (кг)</label>
                <input type="number" class="form-input" id="target_weight" name="target_weight" placeholder="65" min="30" max="300" step="0.1">
            </div>

            <!-- Активность -->
            <div class="form-group">
                <label class="form-label">Уровень активности</label>
                <select class="form-select" id="activity_level" name="activity_level">
                    <option value="sedentary">🪑 Сидячий (офис, мало движения)</option>
                    <option value="light">🚶 Лёгкая (1-3 тренировки в неделю)</option>
                    <option value="moderate" selected>🏃 Умеренная (3-5 тренировок)</option>
                    <option value="active">🏋️ Высокая (6-7 тренировок)</option>
                    <option value="very_active">⚡ Очень высокая (профи спорт)</option>
                </select>
            </div>

            <!-- Предварительный расчёт -->
            <div class="card" id="preview-card" style="display: none;">
                <div class="card-title">📊 Твоя норма КБЖУ</div>
                <div style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 700; color: var(--calories-color);" id="preview-calories">—</div>
                    <div style="color: var(--tg-theme-hint-color);">ккал в день</div>
                </div>
                <div class="macros-grid mt-16">
                    <div class="macro-item">
                        <div class="macro-icon">🥩</div>
                        <div class="macro-value" id="preview-protein">—</div>
                        <div class="macro-label">Белки (г)</div>
                    </div>
                    <div class="macro-item">
                        <div class="macro-icon">🍞</div>
                        <div class="macro-value" id="preview-carbs">—</div>
                        <div class="macro-label">Углеводы (г)</div>
                    </div>
                    <div class="macro-item">
                        <div class="macro-icon">🧈</div>
                        <div class="macro-value" id="preview-fat">—</div>
                        <div class="macro-label">Жиры (г)</div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success mt-16" id="submit-btn">
                ✅ Сохранить профиль
            </button>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const app = window.KaloriyaApp;
        let previewTimeout = null;

        // Show target weight for lose/gain goals
        document.querySelectorAll('input[name="goal"]').forEach(input => {
            input.addEventListener('change', (e) => {
                const targetGroup = document.getElementById('target-weight-group');
                if (e.target.value === 'lose' || e.target.value === 'gain') {
                    targetGroup.style.display = 'block';
                } else {
                    targetGroup.style.display = 'none';
                }
                updatePreview();
            });
        });

        // Update preview on input change
        ['age', 'height', 'weight', 'activity_level'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                clearTimeout(previewTimeout);
                previewTimeout = setTimeout(updatePreview, 500);
            });
        });

        document.querySelectorAll('input[name="gender"]').forEach(input => {
            input.addEventListener('change', updatePreview);
        });

        async function updatePreview() {
            const form = document.getElementById('profile-form');
            const formData = new FormData(form);

            const weight = parseFloat(formData.get('weight'));
            const height = parseFloat(formData.get('height'));
            const age = parseInt(formData.get('age'));

            if (!weight || !height || !age) {
                document.getElementById('preview-card').style.display = 'none';
                return;
            }

            try {
                const result = await app.apiRequest('/user/calculate-macros', 'POST', {
                    weight: weight,
                    height: height,
                    age: age,
                    gender: formData.get('gender'),
                    goal: formData.get('goal'),
                    activity_level: formData.get('activity_level')
                });

                document.getElementById('preview-calories').textContent = result.calories;
                document.getElementById('preview-protein').textContent = result.protein;
                document.getElementById('preview-carbs').textContent = result.carbs;
                document.getElementById('preview-fat').textContent = result.fat;
                document.getElementById('preview-card').style.display = 'block';

            } catch (error) {
                console.error('Preview error:', error);
            }
        }

        // Form submit
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Сохранение...';

            try {
                const profileData = {
                    weight: parseFloat(formData.get('weight')),
                    height: parseFloat(formData.get('height')),
                    age: parseInt(formData.get('age')),
                    gender: formData.get('gender'),
                    goal: formData.get('goal'),
                    activity_level: formData.get('activity_level')
                };

                const targetWeight = formData.get('target_weight');
                if (targetWeight) {
                    profileData.target_weight = parseFloat(targetWeight);
                }

                await app.saveUserProfile(profileData);

                app.hapticFeedback('success');
                app.showToast('✅ Профиль сохранён!');

                // Close Web App or redirect
                setTimeout(() => {
                    if (window.Telegram?.WebApp) {
                        Telegram.WebApp.close();
                    } else {
                        location.href = '/';
                    }
                }, 1000);

            } catch (error) {
                console.error('Save error:', error);
                app.showToast('❌ Ошибка сохранения');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Сохранить профиль';
            }
        });

        // Back button
        app.showTelegramBackButton(() => {
            if (window.Telegram?.WebApp) {
                Telegram.WebApp.close();
            } else {
                location.href = '/';
            }
        });
    </script>
</body>
</html>
