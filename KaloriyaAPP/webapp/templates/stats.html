<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Статистика - KaloriyaBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Статистика</h1>
            <p>Твой прогресс за неделю</p>
        </div>

        <!-- Streak и средние -->
        <div class="card" id="overview-card">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- График калорий -->
        <div class="card">
            <div class="card-title">🔥 Калории за неделю</div>
            <div id="calories-chart" class="chart-container">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- История веса -->
        <div class="card">
            <div class="card-title">⚖️ История веса</div>
            <div id="weight-chart">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Рекомендации -->
        <div class="card" id="recommendations-card">
            <div class="card-title">💡 Рекомендации</div>
            <div id="recommendations-content">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Мотивация -->
        <div class="card" id="motivation-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
            <div id="motivation-content" style="text-align: center; padding: 12px;">
                <div class="loading">
                    <div class="spinner" style="border-color: rgba(255,255,255,0.3); border-top-color: white;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const app = window.KaloriyaApp;

        async function loadStats() {
            try {
                // Load all data in parallel
                const [weeklyStats, recommendations, weightHistory] = await Promise.all([
                    app.getWeeklyStats(),
                    app.getRecommendations(),
                    loadWeightHistory()
                ]);

                renderOverview(weeklyStats);
                renderCaloriesChart(weeklyStats);
                renderWeightChart(weightHistory);
                renderRecommendations(recommendations);

                // Load motivation separately (AI call)
                loadMotivation();

            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadWeightHistory() {
            try {
                const userId = app.getTelegramUserId();
                return await app.apiRequest(`/stats/weight-history/${userId}?days=30`);
            } catch {
                return [];
            }
        }

        async function loadMotivation() {
            try {
                const userId = app.getTelegramUserId();
                const result = await app.apiRequest(`/stats/motivation/${userId}`);
                document.getElementById('motivation-content').innerHTML = `
                    <div style="font-size: 16px; line-height: 1.5;">💪 ${result.message}</div>
                `;
            } catch {
                document.getElementById('motivation-card').style.display = 'none';
            }
        }

        function renderOverview(stats) {
            const container = document.getElementById('overview-card');

            container.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; text-align: center;">
                    <div>
                        <div style="font-size: 36px; font-weight: 700; color: var(--warning-color);">🔥 ${stats.streak}</div>
                        <div style="color: var(--tg-theme-hint-color);">дней подряд</div>
                    </div>
                    <div>
                        <div style="font-size: 36px; font-weight: 700; color: var(--calories-color);">${stats.avg_calories}</div>
                        <div style="color: var(--tg-theme-hint-color);">ккал/день (сред.)</div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; text-align: center; font-size: 13px;">
                    <div>
                        <div style="font-weight: 600;">🥩 ${Math.round(stats.avg_protein)}г</div>
                        <div style="color: var(--tg-theme-hint-color);">белки</div>
                    </div>
                    <div>
                        <div style="font-weight: 600;">🍞 ${Math.round(stats.avg_carbs)}г</div>
                        <div style="color: var(--tg-theme-hint-color);">углеводы</div>
                    </div>
                    <div>
                        <div style="font-weight: 600;">🧈 ${Math.round(stats.avg_fat)}г</div>
                        <div style="color: var(--tg-theme-hint-color);">жиры</div>
                    </div>
                </div>
            `;
        }

        function renderCaloriesChart(stats) {
            const container = document.getElementById('calories-chart');

            if (!stats.days || stats.days.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-text">Нет данных за неделю</div>
                    </div>
                `;
                return;
            }

            // Find max for scaling
            const maxCal = Math.max(...stats.days.map(d => d.total_calories), 1);

            // Get last 7 days labels
            const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

            let barsHtml = '<div class="day-bar">';

            // Create array of last 7 days
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                const dayData = stats.days.find(d => d.date === dateStr);

                const calories = dayData ? dayData.total_calories : 0;
                const height = maxCal > 0 ? (calories / maxCal) * 130 : 0;
                const dayName = dayNames[date.getDay()];

                const isToday = i === 0;
                const barColor = isToday ? 'var(--tg-theme-button-color)' : 'var(--tg-theme-hint-color)';
                const opacity = isToday ? '1' : '0.5';

                barsHtml += `
                    <div class="day-bar-item">
                        <div class="day-bar-fill" style="height: ${height}px; background: ${barColor}; opacity: ${opacity};"></div>
                        <div class="day-bar-label">${dayName}</div>
                        <div style="font-size: 10px; color: var(--tg-theme-hint-color);">${calories > 0 ? calories : '-'}</div>
                    </div>
                `;
            }

            barsHtml += '</div>';

            // Add target line
            container.innerHTML = barsHtml;
        }

        function renderWeightChart(history) {
            const container = document.getElementById('weight-chart');

            if (!history || history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 20px 0;">
                        <div class="empty-state-text">Нет записей веса<br>Взвешивайся регулярно для отслеживания прогресса</div>
                        <button class="btn btn-secondary mt-16" onclick="logWeight()">⚖️ Записать вес</button>
                    </div>
                `;
                return;
            }

            // Show last entries
            let html = '<div style="max-height: 200px; overflow-y: auto;">';

            history.slice().reverse().forEach((entry, index) => {
                const date = new Date(entry.date);
                const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

                // Calculate change from previous
                let change = '';
                if (index < history.length - 1) {
                    const prevWeight = history[history.length - 2 - index]?.weight;
                    if (prevWeight) {
                        const diff = entry.weight - prevWeight;
                        if (diff > 0) {
                            change = `<span style="color: var(--danger-color);">+${diff.toFixed(1)}</span>`;
                        } else if (diff < 0) {
                            change = `<span style="color: var(--success-color);">${diff.toFixed(1)}</span>`;
                        }
                    }
                }

                html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05);">
                        <span style="color: var(--tg-theme-hint-color);">${dateStr}</span>
                        <span>
                            <strong>${entry.weight} кг</strong>
                            ${change}
                        </span>
                    </div>
                `;
            });

            html += '</div>';
            html += `<button class="btn btn-secondary mt-16" onclick="logWeight()">⚖️ Записать вес</button>`;

            container.innerHTML = html;
        }

        function renderRecommendations(recommendations) {
            const container = document.getElementById('recommendations-content');

            if (!recommendations || recommendations.length === 0) {
                document.getElementById('recommendations-card').style.display = 'none';
                return;
            }

            container.innerHTML = recommendations.slice(0, 3).map(rec => `
                <div class="recommendation">
                    <div class="recommendation-icon">${getRecIcon(rec.type)}</div>
                    <div class="recommendation-content">
                        <div class="recommendation-title">${rec.title}</div>
                        <div class="recommendation-message">${rec.message}</div>
                    </div>
                </div>
            `).join('');
        }

        function getRecIcon(type) {
            const icons = {
                'increase_calories': '📈',
                'decrease_calories': '📉',
                'drink_water': '💧',
                'log_weight': '⚖️',
                'keep_streak': '🔥',
                'motivation': '💪',
                'increase_protein': '🥩'
            };
            return icons[type] || '💡';
        }

        async function logWeight() {
            const weight = prompt('Введи свой вес (кг):', '');
            if (weight && !isNaN(weight)) {
                try {
                    await app.logWeight(parseFloat(weight));
                    app.showToast(`⚖️ ${weight} кг записано`);
                    app.hapticFeedback('light');
                    loadStats(); // Reload
                } catch (error) {
                    app.showToast('Ошибка');
                }
            }
        }

        // Back button
        app.showTelegramBackButton(() => {
            if (window.Telegram?.WebApp) {
                Telegram.WebApp.close();
            } else {
                location.href = '/';
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', loadStats);
    </script>
</body>
</html>
