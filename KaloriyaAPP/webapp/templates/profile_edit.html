<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Редактировать профиль - KaloriyaBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ Редактировать профиль</h1>
        </div>

        <div id="form-container">
            <div class="loading">
                <div class="spinner"></div>
                <div class="loading-text">Загрузка...</div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const app = window.KaloriyaApp;

        async function loadAndRenderForm() {
            try {
                const profile = await app.loadUserProfile();
                renderForm(profile);
            } catch (error) {
                console.error('Failed to load profile:', error);
                app.showError(document.getElementById('form-container'), 'Не удалось загрузить профиль');
            }
        }

        function renderForm(profile) {
            const container = document.getElementById('form-container');

            container.innerHTML = `
                <form id="profile-form">
                    <!-- Пол -->
                    <div class="form-group">
                        <label class="form-label">Пол</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" name="gender" id="gender-male" value="male" ${profile.gender === 'male' ? 'checked' : ''}>
                                <label for="gender-male">👨 Мужской</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="gender" id="gender-female" value="female" ${profile.gender === 'female' ? 'checked' : ''}>
                                <label for="gender-female">👩 Женский</label>
                            </div>
                        </div>
                    </div>

                    <!-- Возраст -->
                    <div class="form-group">
                        <label class="form-label" for="age">Возраст</label>
                        <input type="number" class="form-input" id="age" name="age" value="${profile.age || ''}" placeholder="25" min="14" max="100" required>
                    </div>

                    <!-- Рост и Вес -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label class="form-label" for="height">Рост (см)</label>
                            <input type="number" class="form-input" id="height" name="height" value="${profile.height || ''}" placeholder="175" min="100" max="250" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="weight">Вес (кг)</label>
                            <input type="number" class="form-input" id="weight" name="weight" value="${profile.weight || ''}" placeholder="70" min="30" max="300" step="0.1" required>
                        </div>
                    </div>

                    <!-- Цель -->
                    <div class="form-group">
                        <label class="form-label">Цель</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" name="goal" id="goal-lose" value="lose" ${profile.goal === 'lose' ? 'checked' : ''}>
                                <label for="goal-lose">🏃 Похудеть</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="goal" id="goal-maintain" value="maintain" ${profile.goal === 'maintain' || !profile.goal ? 'checked' : ''}>
                                <label for="goal-maintain">⚖️ Поддержать</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="goal" id="goal-gain" value="gain" ${profile.goal === 'gain' ? 'checked' : ''}>
                                <label for="goal-gain">💪 Набрать</label>
                            </div>
                        </div>
                    </div>

                    <!-- Целевой вес -->
                    <div class="form-group" id="target-weight-group" style="${profile.goal === 'lose' || profile.goal === 'gain' ? '' : 'display: none;'}">
                        <label class="form-label" for="target_weight">Целевой вес (кг)</label>
                        <input type="number" class="form-input" id="target_weight" name="target_weight" value="${profile.target_weight || ''}" placeholder="65" min="30" max="300" step="0.1">
                    </div>

                    <!-- Активность -->
                    <div class="form-group">
                        <label class="form-label">Уровень активности</label>
                        <select class="form-select" id="activity_level" name="activity_level">
                            <option value="sedentary" ${profile.activity_level === 'sedentary' ? 'selected' : ''}>🪑 Сидячий (офис, мало движения)</option>
                            <option value="light" ${profile.activity_level === 'light' ? 'selected' : ''}>🚶 Лёгкая (1-3 тренировки в неделю)</option>
                            <option value="moderate" ${profile.activity_level === 'moderate' || !profile.activity_level ? 'selected' : ''}>🏃 Умеренная (3-5 тренировок)</option>
                            <option value="active" ${profile.activity_level === 'active' ? 'selected' : ''}>🏋️ Высокая (6-7 тренировок)</option>
                            <option value="very_active" ${profile.activity_level === 'very_active' ? 'selected' : ''}>⚡ Очень высокая (профи спорт)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success mt-16" id="submit-btn">
                        ✅ Сохранить изменения
                    </button>
                </form>
            `;

            // Event listeners
            document.querySelectorAll('input[name="goal"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const targetGroup = document.getElementById('target-weight-group');
                    if (e.target.value === 'lose' || e.target.value === 'gain') {
                        targetGroup.style.display = 'block';
                    } else {
                        targetGroup.style.display = 'none';
                    }
                });
            });

            document.getElementById('profile-form').addEventListener('submit', handleSubmit);
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Сохранение...';

            try {
                const profileData = {
                    weight: parseFloat(formData.get('weight')),
                    height: parseFloat(formData.get('height')),
                    age: parseInt(formData.get('age')),
                    gender: formData.get('gender'),
                    goal: formData.get('goal'),
                    activity_level: formData.get('activity_level')
                };

                const targetWeight = formData.get('target_weight');
                if (targetWeight) {
                    profileData.target_weight = parseFloat(targetWeight);
                }

                await app.saveUserProfile(profileData);

                app.hapticFeedback('success');
                app.showToast('✅ Профиль обновлён!');

                setTimeout(() => {
                    if (window.Telegram?.WebApp) {
                        Telegram.WebApp.close();
                    } else {
                        location.href = '/profile';
                    }
                }, 1000);

            } catch (error) {
                console.error('Save error:', error);
                app.showToast('❌ Ошибка сохранения');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Сохранить изменения';
            }
        }

        // Back button
        app.showTelegramBackButton(() => {
            if (window.Telegram?.WebApp) {
                Telegram.WebApp.close();
            } else {
                location.href = '/profile';
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', loadAndRenderForm);
    </script>
</body>
</html>
