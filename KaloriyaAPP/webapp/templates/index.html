<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaloriyaBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍎 KaloriyaBot</h1>
            <p>Твой персональный помощник</p>
        </div>

        <div id="today-stats" class="card">
            <div class="loading">
                <div class="spinner"></div>
                <div class="loading-text">Загрузка...</div>
            </div>
        </div>

        <div id="meal-plan" class="card">
            <div class="card-title">🍽 План на день</div>
            <div id="meal-plan-content"></div>
        </div>

        <div id="recommendations" class="card hidden">
            <div class="card-title">💡 Рекомендации</div>
            <div id="recommendations-content"></div>
        </div>

        <div class="mt-16">
            <button class="btn btn-primary" onclick="openCamera()">
                📸 Добавить еду
            </button>
        </div>

        <div class="mt-16" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <button class="btn btn-secondary" onclick="location.href='/diary'">
                📖 Дневник
            </button>
            <button class="btn btn-secondary" onclick="location.href='/stats'">
                📊 Статистика
            </button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const app = window.KaloriyaApp;

        async function loadDashboard() {
            try {
                // Load today stats
                const stats = await app.getTodayStats();
                renderTodayStats(stats);

                // Load meal plan
                const mealPlan = await app.getMealPlan();
                renderMealPlan(mealPlan);

                // Load recommendations
                const recommendations = await app.getRecommendations();
                if (recommendations.length > 0) {
                    renderRecommendations(recommendations);
                }

            } catch (error) {
                console.error('Failed to load dashboard:', error);
                app.showError(document.getElementById('today-stats'), 'Не удалось загрузить данные');
            }
        }

        function renderTodayStats(stats) {
            const container = document.getElementById('today-stats');
            const caloriesPercent = stats.calories_percent || 0;
            const proteinPercent = Math.min(100, Math.round((stats.total_protein / stats.target_protein) * 100)) || 0;
            const carbsPercent = Math.min(100, Math.round((stats.total_carbs / stats.target_carbs) * 100)) || 0;
            const fatPercent = Math.min(100, Math.round((stats.total_fat / stats.target_fat) * 100)) || 0;

            container.innerHTML = `
                <div class="card-title">🔥 Сегодня</div>

                <div class="progress-container">
                    <div class="progress-header">
                        <span class="progress-label">🔥 Калории</span>
                        <span class="progress-value">${stats.total_calories} / ${stats.target_calories}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill calories" style="width: ${caloriesPercent}%"></div>
                    </div>
                </div>

                <div class="macros-grid">
                    <div class="macro-item">
                        <div class="macro-icon">🥩</div>
                        <div class="macro-value">${Math.round(stats.total_protein)}г</div>
                        <div class="macro-label">Белки</div>
                        <div style="font-size: 11px; color: var(--tg-theme-hint-color);">из ${stats.target_protein}г</div>
                    </div>
                    <div class="macro-item">
                        <div class="macro-icon">🍞</div>
                        <div class="macro-value">${Math.round(stats.total_carbs)}г</div>
                        <div class="macro-label">Углеводы</div>
                        <div style="font-size: 11px; color: var(--tg-theme-hint-color);">из ${stats.target_carbs}г</div>
                    </div>
                    <div class="macro-item">
                        <div class="macro-icon">🧈</div>
                        <div class="macro-value">${Math.round(stats.total_fat)}г</div>
                        <div class="macro-label">Жиры</div>
                        <div style="font-size: 11px; color: var(--tg-theme-hint-color);">из ${stats.target_fat}г</div>
                    </div>
                </div>

                ${stats.remaining_calories > 0 ? `
                    <div style="text-align: center; margin-top: 16px; padding: 12px; background: var(--tg-theme-bg-color); border-radius: 12px;">
                        <div style="font-size: 14px; color: var(--tg-theme-hint-color);">Осталось</div>
                        <div style="font-size: 24px; font-weight: 700; color: var(--success-color);">${stats.remaining_calories} ккал</div>
                    </div>
                ` : `
                    <div style="text-align: center; margin-top: 16px; padding: 12px; background: var(--success-color); border-radius: 12px; color: white;">
                        ✅ Норма выполнена!
                    </div>
                `}

                <div style="margin-top: 16px; display: flex; gap: 8px;">
                    <button class="btn btn-secondary" style="flex: 1;" onclick="addWater()">
                        💧 ${stats.water_ml} мл
                    </button>
                    <button class="btn btn-secondary" style="flex: 1;" onclick="logWeightPrompt()">
                        ⚖️ Вес
                    </button>
                </div>
            `;
        }

        function renderMealPlan(mealPlan) {
            const container = document.getElementById('meal-plan-content');

            const meals = ['breakfast', 'lunch', 'snack', 'dinner'];
            let html = '';

            meals.forEach(meal => {
                const data = mealPlan[meal];
                if (!data) return;

                const percent = data.percent || 0;
                const statusClass = percent >= 100 ? 'var(--success-color)' :
                                    percent > 0 ? 'var(--warning-color)' : 'var(--tg-theme-hint-color)';

                html += `
                    <div style="display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05);">
                        <div style="font-size: 24px; margin-right: 12px;">${app.getMealTypeEmoji(meal)}</div>
                        <div style="flex: 1;">
                            <div style="font-weight: 500;">${data.name}</div>
                            <div style="font-size: 12px; color: var(--tg-theme-hint-color);">
                                ${data.eaten} / ${data.target} ккал
                            </div>
                        </div>
                        <div style="width: 50px; text-align: right;">
                            <span style="font-weight: 600; color: ${statusClass};">${percent}%</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<div class="empty-state-text">Нет данных</div>';
        }

        function renderRecommendations(recommendations) {
            const card = document.getElementById('recommendations');
            const container = document.getElementById('recommendations-content');

            card.classList.remove('hidden');

            container.innerHTML = recommendations.slice(0, 3).map(rec => `
                <div class="recommendation">
                    <div class="recommendation-icon">${getRecommendationIcon(rec.type)}</div>
                    <div class="recommendation-content">
                        <div class="recommendation-title">${rec.title}</div>
                        <div class="recommendation-message">${rec.message}</div>
                    </div>
                </div>
            `).join('');
        }

        function getRecommendationIcon(type) {
            const icons = {
                'increase_calories': '📈',
                'decrease_calories': '📉',
                'drink_water': '💧',
                'log_weight': '⚖️',
                'keep_streak': '🔥',
                'motivation': '💪'
            };
            return icons[type] || '💡';
        }

        function openCamera() {
            app.hapticFeedback('light');
            location.href = '/camera';
        }

        async function addWater() {
            const options = ['200', '300', '500', '1000'];
            const ml = prompt('Сколько воды? (мл)', '250');
            if (ml && !isNaN(ml)) {
                try {
                    await app.logWater(parseInt(ml));
                    app.showToast(`💧 +${ml} мл`);
                    app.hapticFeedback('light');
                    loadDashboard();
                } catch (error) {
                    app.showToast('Ошибка');
                }
            }
        }

        async function logWeightPrompt() {
            const weight = prompt('Введи свой вес (кг):', '');
            if (weight && !isNaN(weight)) {
                try {
                    await app.logWeight(parseFloat(weight));
                    app.showToast(`⚖️ ${weight} кг записано`);
                    app.hapticFeedback('light');
                } catch (error) {
                    app.showToast('Ошибка');
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
